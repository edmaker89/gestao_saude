services:
  db:
    image: mariadb:10
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gestao_saude_db}
      MARIADB_USER: ${MARIADB_USER:-gestao_saude_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Defina MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: gestao-saude-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://${MARIADB_USER:-gestao_saude_user}:${MARIADB_PASSWORD:?Defina MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-gestao_saude_db}"
      SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SEED_ON_EMPTY: "${SEED_ON_EMPTY:-true}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_SMTP_SERVER: "${EMAIL_SMTP_SERVER:-}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-}"
      APP_HOST: "${APP_HOST:-0.0.0.0}"
      APP_PORT: "${APP_PORT:-5000}"
      APP_THREADS: "${APP_THREADS:-8}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mariadb_data:
