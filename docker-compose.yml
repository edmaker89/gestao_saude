services:
  db:
    image: mariadb:10
    container_name: gestao_saude_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gestao_saude_db}
      MARIADB_USER: ${MARIADB_USER:-gestao_saude_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    build: .
    container_name: gestao_saude_app
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql+pymysql://${MARIADB_USER:-gestao_saude_user}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-gestao_saude_db}"
      SECRET_KEY: ${SECRET_KEY}
      # Padrão true: exige HTTPS. Para acesso direto por HTTP (sem proxy TLS), use false.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}

  adminer:
    image: adminer:latest
    container_name: gestao_saude_adminer
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  mariadb_data:
  portainer_data:
