apiVersion: v1
kind: ConfigMap
metadata:
  name: gestao-saude-config
  labels:
    app: gestao-saude
data:
  SESSION_COOKIE_SECURE: "true"
  SEED_ON_EMPTY: "true"
  EMAIL_SMTP_SERVER: "smtp.example.com"
  EMAIL_SMTP_PORT: "587"
  APP_HOST: "0.0.0.0"
  APP_PORT: "5000"
  APP_THREADS: "8"
  MARIADB_DATABASE: "gestao_saude_db"
  MARIADB_USER: "gestao_saude_user"
